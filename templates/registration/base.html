<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Eventos do Campus{% endblock %}</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:60rem;margin:1rem auto;padding:0 1rem}
    nav{display:flex;gap:1rem;align-items:center;border-bottom:1px solid #ccc;padding-bottom:.5rem;flex-wrap:wrap}
    table{border-collapse:collapse;width:100%} td,th{border-bottom:1px solid #ddd;padding:.4rem;text-align:left}
    .msg{padding:.5rem;margin:.5rem 0;border-radius:4px;background:#eef} .msg.error{background:#fdd} .msg.success{background:#dfd}
    form.inline{display:inline} .errorlist{color:#b00}
  </style>
</head>
<body>
<nav>
  <a href="{% url 'evento_lista' %}">Eventos</a>
  {% if user.is_authenticated %}
    <a href="{% url 'agenda' %}">Minha agenda</a>
    {% if perms.eventos.add_evento %}
      <a href="{% url 'meus_eventos' %}">Meus eventos</a>
      <a href="{% url 'evento_criar' %}">Novo evento</a>
    {% endif %}
    <span>{{ user.username }}</span>
    <form class="inline" method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Sair</button></form>
  {% else %}
    <a href="{% url 'login' %}">Entrar</a>
    <a href="{% url 'cadastro' %}">Cadastrar</a>
  {% endif %}
</nav>
{% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
{% block content %}{% endblock %}
</body>
</html>
